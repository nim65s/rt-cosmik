[project]
name = "rtcosmik"
version = "0.1.0"
description="Real-Time Constrained and Open-Source Multibody Inverse Kinematics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [ ]

[project.scripts]
rtcosmik = "rtcosmik.scripts.rtcosmik:main"
rtcosmik-cameras = "rtcosmik.scripts.run_cameras:main"
rtcosmik-nlf-inference = "rtcosmik.scripts.run_nlf_inference:main"
rtcosmik-ocp-codegen = "rtcosmik.scripts.run_ocp_codegen:main"
rtcosmik-pipeline = "rtcosmik.scripts.run_pipeline:main"
rtcosmik-triangulation = "rtcosmik.scripts.run_triangulation:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.13.0"]
build-backend = "uv_build"
